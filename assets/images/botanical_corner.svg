<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" class="botanical-corner-svg">
  <defs>
    <linearGradient id="cOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C9D80" />
      <stop offset="100%" stop-color="#4A5B40" />
    </linearGradient>
    <linearGradient id="cGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BF65" />
      <stop offset="100%" stop-color="#C59B3F" />
    </linearGradient>
  </defs>

  <!-- Rama Curva Orgánica de Esquina -->
  <path d="M 15,185 C 25,120 70,60 145,25 C 165,15 185,10 195,8" stroke="#5A6B4F" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 80,75 C 110,65 140,75 160,95" stroke="#7E8F72" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Hojas de Olivo / Eucalipto -->
  <path d="M 45,140 C 30,120 40,105 60,115 C 72,122 65,135 45,140 Z" fill="url(#cOlive)"/>
  <path d="M 75,98 C 60,80 72,65 92,75 C 102,82 95,95 75,98 Z" fill="#6B7D5F"/>
  <path d="M 112,62 C 98,44 110,30 130,40 C 140,46 132,60 112,62 Z" fill="url(#cOlive)"/>
  <path d="M 155,32 C 142,16 154,5 172,14 C 182,20 174,32 155,32 Z" fill="#5A6B4F"/>

  <!-- Pequeñas aceitunas / frutos dorados -->
  <circle cx="58" cy="110" r="3.5" fill="url(#cGold)"/>
  <circle cx="95" cy="70" r="3" fill="url(#cGold)"/>
  <circle cx="138" cy="38" r="3" fill="url(#cGold)"/>

  <!-- Destellos dorados en la esquina -->
  <circle cx="18" cy="180" r="2" fill="url(#cGold)" opacity="0.8"/>
  <circle cx="28" cy="155" r="2.5" fill="url(#cGold)" opacity="0.6"/>
  <circle cx="185" cy="12" r="2" fill="url(#cGold)" opacity="0.8"/>
</svg>
